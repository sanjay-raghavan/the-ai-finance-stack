[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "the-ai-finance-stack-qbo-mcp"
version = "0.1.0"
description = "Bundled local MCP server for QuickBooks Online. Read-only in v0.1. Part of The AI Finance Stack."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sanjay Raghavan" }]
keywords = ["mcp", "quickbooks", "qbo", "finance", "agents"]

dependencies = [
    "mcp>=1.0.0",            # Anthropic's Python MCP SDK
    "httpx>=0.27.0",         # HTTP client for the QBO REST API
    "pydantic>=2.0.0",       # Schema validation for tool args / responses
    "python-dotenv>=1.0.0",  # Load credentials from .env
    "intuit-oauth>=1.2.6",   # Intuit's official OAuth helper (token refresh quirks)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
qbo-mcp = "qbo_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"
